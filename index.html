<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vai-ônibus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef5ff;
      margin: 0;
      color: #12345a;
    }
    header {
      background: #0866d9;
      color: white;
      padding: 25px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px #0001;
    }
    button {
      background: #0866d9;
      color: white;
      border: 0;
      padding: 13px;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚌 VAI-ÔNIBUS</h1>
    <p>Seu ônibus, no seu horário.</p>
  </header>

  <main>
    <div class="card">
      <h2>Bem-vindo!</h2>
      <p>Consulte informações de transporte da sua região.</p>
    </div>

    <div class="card">
      <h3>📍 Escolha sua região</h3>
      <button onclick="alert('Benevides selecionada!')">Benevides</button>
      <br><br>
      <button onclick="alert('Murinin selecionado!')">Murinin</button>
      <br><br>
      <button onclick="alert('Benfica selecionado!')">Benfica</button>
    </div>
  </main>
</body>
</html>
