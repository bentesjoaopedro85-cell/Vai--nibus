
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAIÔNIBUS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef5ff;
  color: #12345a;
}

header {
  background: #0755b8;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin-bottom: 0;
}

main {
  padding: 20px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 3px 12px #0001;
}

input, button {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 9px;
  font-size: 16px;
}

input {
  border: 1px solid #b8cce5;
}

button {
  background: #0755b8;
  color: white;
  border: none;
  font-weight: bold;
}

#mapa {
  width: 100%;
  height: 350px;
  border: 0;
  border-radius: 12px;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 20px;
  color: #567;
}
</style>
</head>

<body>

<header>
  <h1>🚌 VAIÔNIBUS</h1>
  <p>Seu ônibus, seu caminho!</p>
</header>

<main>
  <div class="card">
    <h2>Buscar trajeto</h2>

    <input id="origem" placeholder="Digite sua origem">

    <input id="destino" placeholder="Digite seu destino">

    <button onclick="buscarTrajeto()">
      Buscar trajeto
    </button>

    <div id="resultado"></div>

    <iframe
      id="mapa"
      src="https://maps.google.com/maps?q=Benevides,PA&output=embed"
      loading="lazy">
    </iframe>
  </div>
</main>

<footer>
  VAIÔNIBUS © 2026
</footer>

<script>
function buscarTrajeto() {
  const origem = document.getElementById("origem").value.trim();
  const destino = document.getElementById("destino").value.trim();

  if (!origem || !destino) {
    alert("Digite a origem e o destino!");
    return;
  }

  document.getElementById("resultado").innerHTML =
    "<p>Trajeto encontrado! Veja o mapa abaixo.</p>";

  document.getElementById("mapa").src =
    "https://maps.google.com/maps?saddr=" +
    encodeURIComponent(origem) +
    "&daddr=" +
    encodeURIComponent(destino) +
    "&output=embed";
}
</script>

</body>
</html>
